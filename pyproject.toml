[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superclaude-mvp"
version = "0.1.0"
authors = [
    {name = "GitMVP", email = "mvp@example.com"}
]
description = "Simplified MVP of SuperClaude Framework - CLI tool for managing framework files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]
keywords = ["cli", "framework", "automation", "development", "mvp"]
dependencies = [
    "setuptools>=45.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0"
]

[project.urls]
Homepage = "https://github.com/gitmvp-com/superclaude-mvp"
GitHub = "https://github.com/gitmvp-com/superclaude-mvp"
"Bug Tracker" = "https://github.com/gitmvp-com/superclaude-mvp/issues"

[project.scripts]
superclaude-mvp = "superclaude_mvp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["superclaude_mvp*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"superclaude_mvp" = ["data/*.yaml", "data/*.yml", "data/*.json"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
