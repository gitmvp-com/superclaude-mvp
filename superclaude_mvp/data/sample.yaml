# SuperClaude MVP Sample Configuration\n# This file demonstrates the configuration structure\n\nframework:\n  name: SuperClaude MVP\n  version: 0.1.0\n  description: Simplified CLI Framework Manager\n\nsettings:\n  auto_update: false\n  verbose: false\n  log_level: info\n\npaths:\n  data: ./data\n  config: ./config\n  logs: ./logs\n\nfeatures:\n  cli:\n    enabled: true\n    commands:\n      - install\n      - update\n      - uninstall\n  \n  installer:\n    enabled: true\n    backup_before_install: true\n    force_overwrite: false\n\nexamples:\n  basic_usage: |\n    # Install framework\n    superclaude-mvp install\n    \n    # Update framework\n    superclaude-mvp update\n    \n    # Uninstall framework\n    superclaude-mvp uninstall\n